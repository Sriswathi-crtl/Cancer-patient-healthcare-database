{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assign Patient</title>


    <style>

        /* ================================
           RESET
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* ================================
           BODY
        ================================= */

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #f1f5f9,
                    #eaf2ff
                );

            color: #1e293b;

            padding: 40px 20px;
        }


        /* ================================
           MAIN CONTAINER
        ================================= */

        .page-container {
            max-width: 850px;

            margin: auto;
        }


        /* ================================
           TOP NAVIGATION
        ================================= */

        .top-navigation {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .back-dashboard {

            text-decoration: none;

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 10px 18px;

            background: white;

            color: #475569;

            border: 1px solid #e2e8f0;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 600;

            transition: 0.3s;
        }


        .back-dashboard:hover {

            background: #f8fafc;

            border-color: #2563eb;

            color: #2563eb;

        }


        /* ================================
           PAGE HEADER
        ================================= */

        .page-header {

            margin-bottom: 25px;
        }


        .page-header h1 {

            font-size: 30px;

            color: #0f172a;

            margin-bottom: 8px;
        }


        .page-header p {

            color: #64748b;

            font-size: 15px;
        }


        /* ================================
           MAIN CARD
        ================================= */

        .assignment-card {

            background: white;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 10px 35px
                rgba(15, 23, 42, 0.08);

            border: 1px solid #e2e8f0;
        }


        /* ================================
           CARD HEADER
        ================================= */

        .card-header {

            display: flex;

            align-items: center;

            gap: 18px;

            padding-bottom: 25px;

            margin-bottom: 30px;

            border-bottom: 1px solid #e2e8f0;
        }


        .card-icon {

            width: 60px;

            height: 60px;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            background: #dbeafe;
        }


        .card-header h2 {

            font-size: 21px;

            color: #1e293b;

            margin-bottom: 5px;
        }


        .card-header p {

            color: #64748b;

            font-size: 14px;
        }


        /* ================================
           FORM
        ================================= */

        form p {

            margin-bottom: 22px;

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        form label {

            font-size: 14px;

            font-weight: 600;

            color: #334155;
        }


        form select {

            width: 100%;

            padding: 14px 15px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            background: white;

            color: #1e293b;

            font-size: 15px;

            outline: none;

            cursor: pointer;

            transition: 0.3s;
        }


        form select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }


        /* ================================
           BUTTON AREA
        ================================= */

        .button-area {

            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 30px;

            padding-top: 25px;

            border-top: 1px solid #e2e8f0;
        }


        /* ================================
           BUTTONS
        ================================= */

        .btn {

            text-decoration: none;

            border: none;

            cursor: pointer;

            padding: 12px 22px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 600;

            transition: 0.3s;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;
        }


        .view-btn {

            background: #f1f5f9;

            color: #475569;
        }


        .view-btn:hover {

            background: #e2e8f0;

            color: #1e293b;
        }


        .assign-btn {

            background: #2563eb;

            color: white;

            box-shadow:
                0 5px 12px
                rgba(37, 99, 235, 0.2);
        }


        .assign-btn:hover {

            background: #1d4ed8;

            transform: translateY(-2px);
        }


        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 600px) {

            body {
                padding: 25px 15px;
            }


            .assignment-card {

                padding: 25px 20px;
            }


            .page-header h1 {

                font-size: 25px;
            }


            .button-area {

                flex-direction: column;
            }


            .btn {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="page-container">


    <!-- TOP NAVIGATION -->

    <div class="top-navigation">

        <a href="{% url 'admin_dashboard' %}"
           class="back-dashboard">

            ← Back to Dashboard

        </a>

    </div>



    <!-- PAGE HEADER -->

    <div class="page-header">

        <h1>
            Patient Assignment
        </h1>

        <p>
            Assign a patient to a doctor for treatment and medical care.
        </p>

    </div>



    <!-- ASSIGNMENT CARD -->

    <div class="assignment-card">


        <!-- CARD HEADER -->

        <div class="card-header">

            <div class="card-icon">
                🔗
            </div>


            <div>

                <h2>
                    Assign Patient to Doctor
                </h2>

                <p>
                    Select a doctor and patient to create a treatment assignment.
                </p>

            </div>

        </div>



        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}


            <!-- BUTTON AREA -->

            <div class="button-area">


                <a href="{% url 'view_assignments' %}"
                   class="btn view-btn">

                    📋 View Assignments

                </a>


                <button type="submit"
                        class="btn assign-btn">

                    ✓ Assign Patient

                </button>


            </div>


        </form>


    </div>


</div>


</body>

</html>
